name: CRM partner condition inquiries
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Approved partner condition inquiries
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Send approved single inquiries over CRM SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          [[ "$(git branch --show-current)" = ccr-a042c0a9-cjx9fv ]]
          origin=$(git remote get-url origin)
          [[ "${origin%.git}" = https://github.com/abdylzhelil/CRM-bot-tg ]]
          umask 077
          certificate=$(mktemp)
          ciphertext=$(mktemp)
          trap 'rm -f -- "$certificate" "$ciphertext"' EXIT
          cat > "$certificate" <<'PARTNER_CERT'
          -----BEGIN CERTIFICATE-----
          MIIDKTCCAhGgAwIBAgIUfVgrXnZ5c9dG+nD2NBX4V5Sbw9QwDQYJKoZIhvcNAQEL
          BQAwJDEiMCAGA1UEAwwZQ1JNIHBhcnRuZXIgaW5xdWlyeSBhdWRpdDAeFw0yNjEx
          MTUxMDIwMDNaFw0yNjExMTcxMDIwMDNaMCQxIjAgBgNVBAMMGUNSTSBwYXJ0bmVy
          IGlucXVpcnkgYXVkaXQwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQDC
          6BME46SQrkDMlj1tEdoh2lCCVACiobTCKReG1CSgySR289Q1T/aXoV0/+GyR6R+d
          2wfiTH1YsL6lOt9uBFua9meF7ut73iZ6dlQVbEXo8n0VNY52HtfGW0QpbSSXCXl2
          gsZQ0RIXwAyrDVJAGjwK8pNbYZZ5rpiLMkTwiqHtshLWTD+AshlDuIj9lNOxxJVG
          xWb4lPGKbSlXTzpZl0zIGsQgfpM7DwYffWg4KjZAV5Iz70UDrbD5eC57xusXM+If
          Sd5Kd4cG+jFm1d7Pq2iFz7mDXfEwk4HHMOBu8P2a+UdXNnUS/XANEMylb0G9IS/Z
          v5xoHdpVWGt1/E/OWeO1AgMBAAGjUzBRMB0GA1UdDgQWBBQnLU66hfZQKmU8lPjM
          g+u4BsPVljAfBgNVHSMEGDAWgBQnLU66hfZQKmU8lPjMg+u4BsPVljAPBgNVHRMB
          Af8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBAQCfogK0cmcg23AxsvjTxVZSmiiF
          3negOUdAuFQjNxUeOe9dA7wo/DmOrjr4QuUgltmy7DDEvkRlDNYkxGdAStbM72o6
          7jaJi1NmD2uX1unR+AQ7s6vJIHC8on50+3yo4mQbbIJTVLuD0MBp6otBtAnaVQck
          52u/OYRlK6sWuebx7yfFu6ioxOPaLdRLIP48YtYX17IKhuP+fsJzGzxXmh9waC0+
          MneZW9v9IV6KlwA0p+fVdozEqC4hcNnyoNPlK7kne87nTOmNmBX3tagEF3MutlVI
          dJIm4mKlx5YdIobRm55roJGlN02j6wYuK9qg106l7kx7nf4kTEaYEfa2FbSL
          -----END CERTIFICATE-----
          PARTNER_CERT
          set +e
          timeout 110 docker compose exec -T -i bot python - <<'PARTNER_INQUIRY_PY' | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out "$ciphertext" "$certificate"
          """One approved condition inquiry per published contact. Never buys placements."""
          import asyncio
          import hashlib
          import json
          import logging
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          
          CAMPAIGN = "partner-terms-2026-11-15-v1"
          ALLOWED = {"managerAdel": False, "Tut_Admin_Bot": True}
          EXPIRES = datetime(2026, 11, 17, tzinfo=timezone.utc)
          QUESTION = (
              "Здравствуйте! Уточняем условия для сервиса «КлиентРадар» — бота для местных специалистов Дагестана. "
              "Интересует размещение объявлений ремонта, перевозок и красоты в группе «Барахолка Махачкала | Объявления».\n\n"
              "Подскажите, пожалуйста:\n"
              "1. Стоимость одного поста и пакета размещений.\n"
              "2. Кто публикует: администратор или можно согласовать наш аккаунт?\n"
              "3. Срок размещения, требования к фото/ссылкам и маркировке, условия при удалении поста.\n"
              "4. Возможны ли партнёрские условия для нескольких объявлений от мастеров?\n\n"
              "Сейчас только запрос условий. Заказ и оплату пока не подтверждаем. Спасибо!"
          )
          
          
          def utcnow():
              return datetime.now(timezone.utc)
          
          
          def save(path, state):
              temp = path.with_suffix(".tmp")
              with temp.open("w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False)
                  f.flush()
                  os.fsync(f.fileno())
              os.chmod(temp, 0o600)
              os.replace(temp, path)
          
          
          def random_id(username, stage):
              value = hashlib.sha256(f"{CAMPAIGN}:{username}:{stage}".encode()).digest()[:8]
              return int.from_bytes(value, "big") & ((1 << 63) - 1)
          
          
          async def send_once(client, username, stage, text, path, state):
              from telethon import functions
          
              if username not in ALLOWED or stage not in {"inquiry", "start"}:
                  raise ValueError("Not an approved contact or stage")
              if stage == "start" and (not ALLOWED[username] or text != "/start"):
                  raise ValueError("Only the published admin bot may be started")
              if stage == "inquiry" and (ALLOWED[username] or text != QUESTION):
                  raise ValueError("Only the approved human inquiry is permitted in this run")
              key = username + ":" + stage
              if key in state["actions"]:
                  return state["actions"][key]
              if utcnow() >= EXPIRES:
                  raise ValueError("Outreach authorization window expired")
              entity = await client.get_entity(username)
              if getattr(entity, "username", "").lower() != username.lower() or bool(getattr(entity, "bot", False)) != ALLOWED[username]:
                  raise ValueError("Published recipient could not be verified")
              entry = {"status": "reserved", "time": utcnow().isoformat(), "random_id": random_id(username, stage)}
              state["actions"][key] = entry
              save(path, state)  # reserve before Telegram; uncertainty never triggers a resend
              try:
                  result = await client(functions.messages.SendMessageRequest(
                      peer=await client.get_input_entity(entity), message=text,
                      random_id=entry["random_id"], no_webpage=True))
                  message_id = getattr(result, "id", None)
                  for update in getattr(result, "updates", []):
                      message_id = getattr(getattr(update, "message", None), "id", None) or message_id
                      if getattr(update, "random_id", None) == entry["random_id"]:
                          message_id = getattr(update, "id", None) or message_id
                  entry.update(status="sent", message_id=message_id)
              except Exception as exc:
                  entry.update(status="uncertain_or_failed", error_type=type(exc).__name__)
              save(path, state)
              return entry
          
          
          async def collect(client, username, entry):
              after = datetime.fromisoformat(entry["time"]) - timedelta(seconds=2)
              out = []
              for msg in await client.get_messages(username, limit=15):
                  if getattr(msg, "out", False) or msg.date < after:
                      continue
                  buttons = []
                  for row in getattr(getattr(msg, "reply_markup", None), "rows", []) or []:
                      for button in row.buttons:
                          data = getattr(button, "data", b"")
                          buttons.append({"text": button.text, "url": getattr(button, "url", None),
                                          "data_hex": data.hex() if isinstance(data, bytes) else None})
                  out.append({"id": msg.id, "date": msg.date.isoformat(),
                              "text": (msg.message or "")[:4000], "buttons": buttons})
              return out
          
          
          async def main():
              from sqlalchemy import select
              from telethon import TelegramClient
              from telethon.sessions import StringSession
              from app.db import Session
              from app.models import ScoutAccount
          
              os.umask(0o077)
              folder = Path("/srv/data/partner_inquiries") / CAMPAIGN
              folder.mkdir(parents=True, exist_ok=True, mode=0o700)
              import fcntl
              lock = (folder / "lock").open("a")
              fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              path = folder / "state.json"
              state = json.loads(path.read_text()) if path.exists() else {"campaign": CAMPAIGN, "actions": {}}
              if state.get("campaign") != CAMPAIGN:
                  raise ValueError("Ledger belongs to another task")
              async with Session() as s:
                  accounts = list((await s.scalars(select(ScoutAccount).where(ScoutAccount.enabled, ScoutAccount.can_post))).all())
              if len(accounts) != 1 or accounts[0].status != "ok" or not accounts[0].session:
                  raise ValueError("Need one healthy CRM publisher; no account switching or new login")
              acc = accounts[0]
              client = TelegramClient(StringSession(acc.session), acc.api_id, acc.api_hash,
                                      auto_reconnect=False, connection_retries=0, request_retries=0,
                                      flood_sleep_threshold=0, receive_updates=False, catch_up=False,
                                      device_model="Desktop")
              try:
                  await asyncio.wait_for(client.connect(), 15)
                  if not await client.is_user_authorized():
                      raise ValueError("Existing CRM session is not authorized; no login attempted")
                  me = await client.get_me()
                  if me.bot or (acc.tg_user_id and me.id != acc.tg_user_id):
                      raise ValueError("Unexpected sender")
                  if state.get("sender_id") not in (None, me.id):
                      raise ValueError("Do not change sender for this inquiry")
                  state["sender_id"] = me.id
                  save(path, state)
                  for username, stage, text in (("managerAdel", "inquiry", QUESTION), ("Tut_Admin_Bot", "start", "/start")):
                      entry = await send_once(client, username, stage, text, path, state)
                      if entry.get("error_type") in {"PeerFloodError", "FloodWaitError", "AuthKeyDuplicatedError"}:
                          break
                  await asyncio.sleep(8)
                  replies = {}
                  for key, entry in state["actions"].items():
                      try:
                          replies[key] = await collect(client, key.split(":")[0], entry)
                      except Exception as exc:
                          replies[key] = {"error_type": type(exc).__name__}
                  state["replies"] = replies
                  save(path, state)
                  return {"campaign": CAMPAIGN, "actions": state["actions"], "replies": replies}
              finally:
                  await client.disconnect()
                  lock.close()
          
          
          if __name__ == "__main__":
              logging.disable(logging.CRITICAL)
              try:
                  result = asyncio.run(asyncio.wait_for(main(), 90))
                  code = 0
              except Exception as exc:
                  result, code = {"fatal_type": type(exc).__name__}, 1
              print(json.dumps(result, ensure_ascii=True))
              raise SystemExit(code)
          PARTNER_INQUIRY_PY
          result=$?
          set -e
          printf '%s\n' PARTNER_ENCRYPTED_BEGIN
          python3 - "$ciphertext" <<'PARTNER_ENCODE_PY'
          import pathlib,sys
          value=pathlib.Path(sys.argv[1]).read_bytes().hex().translate(str.maketrans("0123456789abcdef","abcdefghijklmnop"))
          for i in range(0,len(value),96): print(value[i:i+96])
          PARTNER_ENCODE_PY
          printf '%s\n' PARTNER_ENCRYPTED_END
          exit "$result"
          
          REMOTE
# User approved inquiries to two published business contacts on 2026-11-15. No purchases, group posts, callbacks or payments.
