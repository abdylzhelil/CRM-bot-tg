          52u/OYRlK6sWuebx7yfFu6ioxOPaLdRLIP48YtYX17IKhuP+fsJzGzxXmh9waC0+
          MneZW9v9IV6KlwA0p+fVdozEqC4hcNnyoNPlK7kne87nTOmNmBX3tagEF3MutlVI
          dJIm4mKlx5YdIobRm55roJGlN02j6wYuK9qg106l7kx7nf4kTEaYEfa2FbSL
          -----END CERTIFICATE-----
          PARTNER_CERT
          set +e
          timeout 110 docker compose exec -T -i bot python - <<'PARTNER_INQUIRY_PY' | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out "$ciphertext" "$certificate"
          import asyncio,json,logging,os
          from pathlib import Path
          from datetime import datetime,timedelta
          from sqlalchemy import select
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from app.db import Session
          from app.models import ScoutAccount
          async def main():
              path=Path("/srv/data/partner_inquiries/partner-terms-2026-11-15-v1/state.json")
              state=json.loads(path.read_text())
              async with Session() as s:
                  acc=await s.scalar(select(ScoutAccount).where(ScoutAccount.tg_user_id==state["sender_id"],ScoutAccount.enabled))
              if acc is None or acc.status!="ok":
                  raise ValueError("Original CRM sender is not available for reading replies")
              client=TelegramClient(StringSession(acc.session),acc.api_id,acc.api_hash,auto_reconnect=False,
                  connection_retries=0,request_retries=0,flood_sleep_threshold=0,receive_updates=False,catch_up=False,device_model="Desktop")
              result={"actions":state["actions"],"replies":{}}
              try:
                  await asyncio.wait_for(client.connect(),15)
                  if not await client.is_user_authorized() or (await client.get_me()).id!=state["sender_id"]:
                      raise ValueError("Original session is not available")
                  await asyncio.sleep(40)
                  for username in ("managerAdel","Tut_Admin_Bot"):
                      entries=[v for k,v in state["actions"].items() if k.startswith(username+":") and v.get("status")=="sent"]
                      if not entries: continue
                      after=min(datetime.fromisoformat(v["time"]) for v in entries)-timedelta(seconds=2)
                      rows=[]
                      for message in await client.get_messages(username,limit=20):
                          if message.out or message.date<after: continue
                          buttons=[]
                          for row in getattr(getattr(message,"reply_markup",None),"rows",[]) or []:
                              for button in row.buttons:
                                  buttons.append({"text":button.text,"url":getattr(button,"url",None)})
                          rows.append({"id":message.id,"date":message.date.isoformat(),"text":(message.message or "")[:5000],"buttons":buttons})
                      result["replies"][username]=rows
                  return result
              finally:
                  await client.disconnect()
          logging.disable(logging.CRITICAL)
          try:
              result=asyncio.run(asyncio.wait_for(main(),100))
              code=0
          except Exception as exc:
              result,code={"fatal_type":type(exc).__name__},1
          print(json.dumps(result,ensure_ascii=True))
          raise SystemExit(code)
          
          PARTNER_INQUIRY_PY
          result=$?
          set -e
          printf '%s\n' PARTNER_ENCRYPTED_BEGIN
          python3 - "$ciphertext" <<'PARTNER_ENCODE_PY'
          import pathlib,sys
          value=pathlib.Path(sys.argv[1]).read_bytes().hex().translate(str.maketrans("0123456789abcdef","abcdefghijklmnop"))
          for i in range(0,len(value),96): print(value[i:i+96])
          PARTNER_ENCODE_PY
          printf '%s\n' PARTNER_ENCRYPTED_END
          exit "$result"
          
          REMOTE
# User approved inquiries to two published business contacts on 2026-11-15. No purchases, group posts, callbacks or payments.

# Admin bot requested a question; send approved terms question once, without resending prior inquiries.
