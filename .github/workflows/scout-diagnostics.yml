name: Remove verified offsite CRM originals
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Free retired CRM disk space
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Owner-authorized cleanup after verified encrypted transfer
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          python3 - 7255be714ef7bc0d7cc712c613e567caf049484ad0f5706efb89743399e32035 <<'VERIFIED_CLEANUP'
          """Remove only the verified retired CRM originals and exclusive unused CRM images."""
          import pathlib,json,subprocess,hashlib,shutil,os,sys
          EXPECTED_MANIFEST=sys.argv[1]
          assert len(EXPECTED_MANIFEST)==64 and all(x in '0123456789abcdef' for x in EXPECTED_MANIFEST)
          root=pathlib.Path('/root/crm-retired').resolve()
          plan=json.loads((root/'offsite-export-plan.json').read_text())
          archive=pathlib.Path(plan['archive'])
          assert archive==archive.resolve() and archive.parent==root and archive.name.startswith('CRM-bot-tg-') and archive.is_dir()
          assert not pathlib.Path('/root/CRM-bot-tg').exists()
          assert (root/'latest-path').read_text().strip()==str(archive)
          manifest_file=archive/'offsite-manifest.json'
          assert hashlib.sha256(manifest_file.read_bytes()).hexdigest()==EXPECTED_MANIFEST==plan['manifest_sha256']
          manifest=json.loads(manifest_file.read_text())
          actual={}
          for p in archive.rglob('*'):
              name=p.relative_to(archive).as_posix()
              if name=='offsite-manifest.json':continue
              if p.is_symlink():actual[name]={'type':'symlink','target':os.readlink(p)}
              elif p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      while chunk:=f.read(1024*1024):h.update(chunk)
                  actual[name]={'type':'file','sha256':h.hexdigest(),'size':p.stat().st_size}
          assert actual==manifest, 'Server archive changed since offsite verification; originals preserved'
          
          
          def containers():
              ids=subprocess.check_output(['docker','ps','-aq'],text=True).split()
              return json.loads(subprocess.check_output(['docker','inspect',*ids],text=True)) if ids else []
          
          
          def snapshot(rows):
              return {r['Id']:{'image':r['Image'],'running':r['State']['Running'],'started':r['State']['StartedAt']} for r in rows}
          
          
          def image(ref):
              r=subprocess.run(['docker','image','inspect',ref],capture_output=True,text=True)
              if r.returncode:
                  if 'No such image' in r.stderr or 'No such object' in r.stderr:return None
                  raise RuntimeError('Docker inspection failed; no further removal')
              return json.loads(r.stdout)[0]
          
          
          rows=containers();before=snapshot(rows)
          assert not any('CRM-bot-tg' in (r.get('Config',{}).get('Labels') or {}).get('com.docker.compose.project.working_dir','') for r in rows)
          for r in rows:
              for mount in r.get('Mounts',[]):
                  if mount.get('Type')=='bind':
                      p=pathlib.Path(mount['Source']).resolve()
                      assert p!=archive and not p.is_relative_to(archive), 'An existing container uses this archive; removal stopped'
          used={r['Image'] for r in rows}
          free_before=shutil.disk_usage(root).free
          removed_tags=0;refused=0;skipped=0
          eligible=[]
          for candidate in plan['images']:
              current=image(candidate['id'])
              if current is None:continue
              tags=current.get('RepoTags') or []
              if current['Id'] in used or not set(tags)<=set(candidate['tags']) or not all(t.startswith(('crm-bot:','crm-rollback:')) for t in tags):
                  skipped+=1;continue
              eligible.append(candidate['id'])
              for tag in tags:
                  live=image(tag)
                  if live is None:continue
                  if live['Id']!=candidate['id']:
                      skipped+=1;continue
                  result=subprocess.run(['docker','image','rm',tag],capture_output=True,text=True)
                  if result.returncode:refused+=1
                  elif image(tag) is None:removed_tags+=1
          # Some parents can only be removed after their children. Retry only the exact
          # backed-up IDs, with no force and no broad cache/image prune.
          for _ in range(len(eligible)+1):
              progress=False
              used={r['Image'] for r in containers()}
              for iid in eligible:
                  current=image(iid)
                  if current is None or iid in used or current.get('RepoTags'):continue
                  result=subprocess.run(['docker','image','rm',iid],capture_output=True,text=True)
                  if result.returncode==0:progress=True
              if not progress:break
          remaining=sum(image(iid) is not None for iid in eligible)
          removed_images=len(eligible)-remaining
          shutil.rmtree(archive)
          assert not archive.exists()
          if (root/'latest-path').read_text().strip()==str(archive):(root/'latest-path').unlink()
          (root/'offsite-export-plan.json').unlink()
          cert=root/'offsite-recipient.pem'
          if cert.exists():cert.unlink()
          after=snapshot(containers());unchanged=before==after
          free_after=shutil.disk_usage(root).free
          result={'server_archive_removed':True,'image_tags_removed':removed_tags,'image_ids_removed':removed_images,
                  'eligible_image_ids_remaining':remaining,'skipped_images':skipped,'removal_refusals':refused,
                  'other_containers_unchanged':unchanged,'other_containers':len(after),
                  'free_bytes_before':free_before,'free_bytes_after':free_after,'free_bytes_gained':free_after-free_before}
          try:root.rmdir()
          except OSError:pass
          print('CRM_OFFSITE_CLEANUP:',json.dumps(result))
          assert unchanged, 'Other container state changed independently; inspect without modifying it'
          VERIFIED_CLEANUP
          REMOTE
