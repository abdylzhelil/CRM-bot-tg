name: CRM scout diagnostics
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Read CRM scout state
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Read-only scout report over CRM SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          [[ "$(git branch --show-current)" = ccr-a042c0a9-cjx9fv ]]
          [[ "$(git remote get-url origin)" = *abdylzhelil/CRM-bot-tg* ]]
          timeout 90 docker compose exec -T -i bot python - <<'INVENTORY_PY'
          import asyncio,json,re
          from collections import Counter
          from sqlalchemy import select,text
          from app import config
          from app.db import Session
          from app.models import Group,ScoutAccount,FeedChat,User,now
          from app.services import adposts,settings,geo
          async def main():
              async with Session() as s:
                  await s.execute(text("PRAGMA query_only=ON"))
                  groups=(await s.scalars(select(Group))).all()
                  accounts={a.id:a for a in (await s.scalars(select(ScoutAccount))).all()}
                  feeds=(await s.scalars(select(FeedChat))).all()
                  visible=await adposts.eligible_groups(s)
                  visible_ids={g.id for g in visible}
                  reasons=Counter()
                  allowed=[]
                  for g in groups:
                      if not g.ads_allowed:reasons["not_permitted"]+=1
                      if g.status!="joined":reasons["not_joined"]+=1
                      if g.ad_closed_at:reasons["temporarily_closed"]+=1
                      if g.captcha_since:reasons["captcha"]+=1
                      aid=g.ad_account_id if g.ad_account_id is not None else g.account_id
                      a=accounts.get(aid)
                      if a is None:reasons["no_publisher"]+=1
                      elif not a.enabled:reasons["publisher_disabled"]+=1
                      elif not a.can_post:reasons["publisher_cannot_post"]+=1
                      if g.ads_allowed:
                          allowed.append({"name":g.title if g.username else "nonpublic","public_url":"https://t.me/"+g.username if g.username else None,"visible":g.id in visible_ids,"status":g.status,"closed":bool(g.ad_closed_at),"captcha":bool(g.captcha_since),"publisher_present":a is not None,"publisher_enabled":bool(a and a.enabled),"publisher_can_post":bool(a and a.can_post),"rules_policy":g.rules_policy,"rules_age_days":(now()-g.rules_checked_at).days if g.rules_checked_at else None,"city":g.city,"region":g.region,"no_media":g.no_media})
                  own_ids={f.tg_id for f in feeds if f.own}
                  own=[g for g in groups if g.tg_id in own_ids or g.board_admin in config.OWNER_IDS]
                  out={"measured_at_utc":now().isoformat(),"ad_enabled":await settings.get(s,"adpost_enabled"),"total_group_records":len(groups),"joined":sum(g.status=="joined" for g in groups),"allowed":sum(g.ads_allowed for g in groups),"visible":len(visible),"visible_with_photo":len(await adposts.eligible_groups(s,photo=True)),"local_visible":sum(geo.priority(g.city,g.region,g.title,await settings.get(s,"home_region"))==0 for g in visible),"blockers_overlap":dict(reasons),"allowed_details":allowed,"owned_or_owner_managed_records":len(own),"owned_visible":sum(g.id in visible_ids for g in own),"owned_blockers":{"not_permitted":sum(not g.ads_allowed for g in own),"not_joined":sum(g.status!="joined" for g in own),"no_assigned_publisher":sum((g.ad_account_id if g.ad_account_id is not None else g.account_id) not in accounts for g in own)},"owner_roles":[{"exists":(u:=await s.get(User,uid)) is not None,"admin":bool(u and u.is_admin)} for uid in sorted(config.OWNER_IDS)]}
                  assert not s.dirty
                  print("CRM_AD_INVENTORY:",json.dumps(out,ensure_ascii=False))
          asyncio.run(main())
          INVENTORY_PY
          REMOTE
# Read-only advertising inventory; no messages, permissions or payment changes.
