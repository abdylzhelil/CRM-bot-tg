name: CRM scout diagnostics
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Read CRM scout state
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Read-only scout report over CRM SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          [[ "$(git branch --show-current)" = ccr-a042c0a9-cjx9fv ]]
          [[ "$(git remote get-url origin)" = *abdylzhelil/CRM-bot-tg* ]]
          printf 'CRM_SOURCE: '
          git rev-parse HEAD
          python3 -c 'import json,shutil; d=shutil.disk_usage("."); print("CRM_STORAGE:",json.dumps({"free_gib":round(d.free/2**30,2)}))'
          timeout 20 docker compose exec -T bot python -c 'import urllib.request,json; from app import config; r=urllib.request.urlopen("http://127.0.0.1:%s/healthz"%config.WEBAPP_PORT,timeout=5); print("CRM_HEALTH:",r.status,json.load(r))'
          timeout 60 docker compose exec -T -i bot python - <<'PILOT_PY'
          import asyncio,json
          from datetime import timedelta
          from sqlalchemy import select,func,text
          from app.db import Session
          from app.models import User,Lead,Delivery,Client,Group,ScoutAccount,now
          from app.services import settings
          async def main():
              async with Session() as s:
                  await s.execute(text("PRAGMA query_only=ON"))
                  week=now()-timedelta(days=7)
                  async def count(model,*conditions):
                      return await s.scalar(select(func.count()).select_from(model).where(*conditions)) or 0
                  out={"measured_at_utc":now().isoformat(),"active_users":await count(User,~User.is_admin,User.onboarded,~User.blocked),"scout_joined_groups":await count(Group,Group.status=="joined",Group.account_id.is_not(None)),"queue":await count(Group,Group.status=="approved"),"search_interval_h":await settings.get(s,"search_interval_h"),"last_search":await settings.raw(s,"search_last"),"accounts":dict((await s.execute(select(ScoutAccount.status,func.count()).where(ScoutAccount.enabled).group_by(ScoutAccount.status))).all())}
                  out["nonadmin_deliveries_7d"]=dict((await s.execute(select(Delivery.status,func.count()).join(User,User.tg_id==Delivery.user_id).where(~User.is_admin,Delivery.created_at>week).group_by(Delivery.status))).all())
                  out["nonadmin_clients_added_7d"]=await s.scalar(select(func.count()).select_from(Client).join(User,User.tg_id==Client.user_id).where(~User.is_admin,Client.created_at>week)) or 0
                  out["all_lead_task_rows_7d"]=await count(Lead,Lead.created_at>week)
                  assert not s.dirty
                  print("TECHNICAL_PILOT_LIVE:",json.dumps(out,ensure_ascii=False))
          asyncio.run(main())
          PILOT_PY
          REMOTE
# Read-only CRM preflight for scout reliability update.

# Verify live CRM after successful scout reliability deployment, 2026-11-21.
