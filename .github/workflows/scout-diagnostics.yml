name: CRM scout recovery
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Verify and resume CRM scout
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Guarded scout recovery over CRM SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          [[ "$(git branch --show-current)" = ccr-a042c0a9-cjx9fv ]]
          printf 'CRM_COMMIT: '
          git rev-parse HEAD
          timeout 120 docker compose exec -T -i bot python - <<'SCOUT_PY'
          import asyncio,json
          from sqlalchemy import select
          from app.db import Session
          from app.models import Group,ScoutAccount
          from app.scout.joiner import joinable
          from app.scout.search import stage
          from app.services import settings
          async def run():
              async with Session() as s:
                  keys=("scout_paused","scout_grow","mode","home_region","join_check")
                  opts={k:await settings.get(s,k) for k in keys}
                  print("SCOUT_SETTINGS:",json.dumps(opts,ensure_ascii=False))
                  assert opts["home_region"]=="Дагестан", "Different home region; no change"
                  assert opts["mode"]=="auto" and opts["scout_grow"]=="1", "Automatic growth is off; no change"
                  assert opts["join_check"]=="1", "Quality checking is off; no change"
                  accounts=(await s.scalars(select(ScoutAccount).where(ScoutAccount.enabled,ScoutAccount.status=="ok"))).all()
                  assert accounts, "No healthy enabled scout; no change"
                  queue=(await s.scalars(select(Group).where(Group.status=="approved",Group.kind=="group"))).all()
                  ready=joinable(queue,"Дагестан",await stage(s))
                  print("QUEUE_READY:",len(ready))
                  assert ready, "No eligible queue; no change"
                  before=opts["scout_paused"]
                  if before=="1":
                      await settings.put(s,"scout_paused","0")
                      await s.commit()
                      print("SCOUT_RESUMED: pause 1 -> 0; region, quality filters, rejected groups and limits unchanged")
                  else:
                      print("SCOUT_ALREADY_RUNNING: no settings changed")
          asyncio.run(run())
          SCOUT_PY
          sleep 45
          timeout 120 docker compose exec -T bot python -m app.scoutreport | python3 -c 'import re,sys; print(re.sub(r"(?<!\w)\+?\d[\d ()-]{8,}\d(?!\w)", "[phone hidden]", sys.stdin.read()))'
          REMOTE
