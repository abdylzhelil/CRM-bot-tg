name: CRM scout diagnostics
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Read CRM scout state
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Read-only scout report over CRM SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          [[ "$(git branch --show-current)" = ccr-a042c0a9-cjx9fv ]]
          [[ "$(git remote get-url origin)" = *abdylzhelil/CRM-bot-tg* ]]
          printf 'CRM_SOURCE: '
          git rev-parse HEAD
          timeout 90 docker compose exec -T -i bot python - <<'SCOUT_AUDIT_PY'
          import asyncio,json
          from collections import Counter
          from datetime import timedelta
          from sqlalchemy import select,func,text
          from app.db import Session
          from app.models import Group,Lead,Delivery,ScoutAccount,FeedChat,SearchQuery,UserSearch,now
          from app.services import settings,geo
          from app.scout import search,joiner
          
          async def main():
              out={'measured_at_utc':now().isoformat()}
              async with Session() as s:
                  await s.execute(text('PRAGMA query_only=ON'))
                  keys=('scout_paused','scout_grow','mode','home_region','scout_places','join_check','search_interval_h','min_members','min_msgs_per_day','min_members_home','min_msgs_home','rotation_days','join_retry_days','join_retry_max','group_audit','group_audit_leave','ai_classify','ai_check_leads','ai_decide','search_stage','search_offset_home','search_offset_near','search_offset','search_stage_found','search_stage_wrapped','search_last')
                  out['settings']={k:(await settings.get(s,k) if k in settings.DEFAULTS else await settings.raw(s,k)) for k in keys}
                  home=await settings.get(s,'home_region');st=await search.stage(s)
                  gs=(await s.scalars(select(Group).where(Group.kind=='group'))).all()
                  out['groups_by_status']=dict(Counter(g.status for g in gs))
                  out['groups_by_status_tier']=dict(Counter(g.status+':'+str(geo.tier(g.city,g.region,home) if g.city or g.region else geo.tier(*geo.title_place(g.title),home)) for g in gs))
                  queue=[g for g in gs if g.status=='approved']
                  out['queue']={'total':len(queue),'joinable_by_stage':len(joiner.joinable(queue,home,st)),'requested_due':sum(g.status=='requested' and g.join_retry_at is not None and g.join_retry_at<=now() for g in gs),'wanted':sum(bool(g.wanted_by) for g in queue)}
                  out['accounts']=[{'enabled':a.enabled,'status':a.status,'has_session':bool(a.session),'daily_limit':a.daily_join_limit,'counter_date':a.joined_date,'daily_actions':a.joined_today,'max_groups':a.max_groups,'joined_db':sum(g.status=='joined' and g.account_id==a.id for g in gs),'assigned_queue':sum(g.account_id==a.id for g in queue)} for a in (await s.scalars(select(ScoutAccount))).all()]
                  tiers=await search.tier_queries(s)
                  out['query_pool_sizes']=[len(t) for t in tiers]
                  manual=(await s.scalars(select(SearchQuery).where(SearchQuery.enabled))).all()
                  out['manual_queries']={'total':len(manual),'dagestan_but_in_rest_tier':sum(geo.tier(*geo.find(q.text),home)==0 and q.text in tiers[2] for q in manual)}
                  out['user_queries']={'total':await s.scalar(select(func.count()).select_from(UserSearch))}
                  for days in (1,7):
                      since=now()-timedelta(days=days)
                      rows=(await s.execute(select(Lead.group_id,Lead.author_id,Lead.text_hash,Lead.created_at,Lead.city,Lead.region).where(Lead.created_at>since))).all()
                      source_groups={}
                      local_sources=set();sources=set()
                      for gid,author,h,at,city,region in rows:
                          key=(author,h,at)
                          sources.add(key)
                          source_groups.setdefault(gid,set()).add(key)
                          if geo.tier(city,region,home)==0:local_sources.add(key)
                      joined=[g for g in gs if g.status=='joined' and g.account_id is not None]
                      local=[g for g in joined if geo.tier(g.city,g.region,home)==0]
                      out[str(days)+'d']={'unique_sources_all_inputs':len(sources),'unique_local_sources_all_inputs':len(local_sources),'scout_joined_groups':len(joined),'scout_groups_with_sources':sum(bool(source_groups.get(g.id)) for g in joined),'scout_local_joined':len(local),'scout_local_with_sources':sum(bool(source_groups.get(g.id)) for g in local),'new_group_records':sum(g.found_at is not None and g.found_at>since for g in gs),'new_joined_records':sum(g.joined_at is not None and g.joined_at>since for g in joined),'deliveries_nonadmin_not_measured':True}
                  joined=[g for g in gs if g.status=='joined' and g.account_id is not None]
                  out['joined_quality']={'no_leads_flag':sum(g.no_leads for g in joined),'no_last_lead':sum(g.last_lead_at is None for g in joined),'captcha':sum(g.captcha_since is not None for g in joined),'audit_verdicts':dict(Counter(g.audit_verdict or 'not_checked' for g in joined)),'watch_at_least_40':sum((g.watch_seen or 0)>=40 for g in joined)}
                  feed=(await s.scalars(select(FeedChat))).all()
                  out['feed']={'known':len(feed),'enabled':sum(f.enabled for f in feed),'disabled_groups_marked_covered':sum(g.status=='covered' and any(f.tg_id==g.tg_id and not f.enabled for f in feed) for g in gs)}
                  assert not s.dirty and not s.new and not s.deleted
              print('SCOUT_AUDIT_AGGREGATES:',json.dumps(out,ensure_ascii=False))
          
          asyncio.run(main())
          SCOUT_AUDIT_PY
          timeout 20 docker compose exec -T bot python -c 'import urllib.request,json; from app import config; r=urllib.request.urlopen("http://127.0.0.1:%s/healthz"%config.WEBAPP_PORT,timeout=5); print("CRM_HEALTH:",r.status,json.load(r))'
          REMOTE
# Scout-only audit: SQLite query_only; aggregate database reads; no Telegram session or API calls.
