          import pathlib,json,subprocess,hashlib,os,shutil
          root=pathlib.Path('/root/crm-retired').resolve()
          archive=pathlib.Path((root/'latest-path').read_text().strip()).resolve()
          assert archive.parent==root and archive.name.startswith('CRM-bot-tg-') and archive.is_dir()
          assert not pathlib.Path('/root/CRM-bot-tg').exists()
          ids=subprocess.check_output(['docker','ps','-aq'],text=True).split()
          containers=json.loads(subprocess.check_output(['docker','inspect',*ids],text=True)) if ids else []
          assert not any('CRM-bot-tg' in (r.get('Config',{}).get('Labels') or {}).get('com.docker.compose.project.working_dir','') for r in containers)
          used={r['Image'] for r in containers}
          rows=[json.loads(line) for line in subprocess.check_output(['docker','image','ls','--no-trunc','--format','{{json .}}'],text=True).splitlines()]
          candidates=sorted({r['ID'] for r in rows if r['Repository'] in ('crm-bot','crm-rollback')})
          images=json.loads(subprocess.check_output(['docker','image','inspect',*candidates],text=True)) if candidates else []
          eligible=[]
          for image in images:
              tags=image.get('RepoTags') or []
              if image['Id'] not in used and tags and all(t.startswith(('crm-bot:','crm-rollback:')) for t in tags):
                  eligible.append({'id':image['Id'],'tags':tags,'size':image['Size']})
          plan={'archive':str(archive),'images':eligible,'other_containers':{r['Id']:{'image':r['Image'],'running':r['State']['Running'],'started':r['State']['StartedAt']} for r in containers}}
          (archive/'offsite-export-plan.json').write_text(json.dumps(plan))
          manifest={}
          for p in sorted(archive.rglob('*')):
              name=p.relative_to(archive).as_posix()
              if name=='offsite-manifest.json':continue
              if p.is_symlink():manifest[name]={'type':'symlink','target':os.readlink(p)}
              elif p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      while chunk:=f.read(1024*1024):h.update(chunk)
                  manifest[name]={'type':'file','sha256':h.hexdigest(),'size':p.stat().st_size}
          (archive/'offsite-manifest.json').write_text(json.dumps(manifest,sort_keys=True))
          plan['manifest_sha256']=hashlib.sha256((archive/'offsite-manifest.json').read_bytes()).hexdigest()
          (root/'offsite-export-plan.json').write_text(json.dumps(plan))
          print('CRM_EXPORT_PREPARED:',json.dumps({'files':sum(x['type']=='file' for x in manifest.values()),'images':len(eligible),'image_refs':sum(len(x['tags']) for x in eligible),'image_logical_bytes':sum(x['size'] for x in eligible),'archive_bytes':int(subprocess.check_output(['du','-sb',str(archive)],text=True).split()[0]),'free_bytes':shutil.disk_usage(root).free}))
          PY_PLAN
          REMOTE
          # The remaining SSH calls stream ciphertext only; plaintext stays on the VPS.
          OUT="$RUNNER_TEMP/crm-offsite"
          install -m 700 -d "$OUT"
          crm_ssh() {
            ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
          }
          crm_ssh <<'EXPORT_FILES' > "$OUT/crm-retired-20261124.tar.gz.cms"
          set -euo pipefail
          ARCHIVE=$(cat /root/crm-retired/latest-path)
          [[ "$ARCHIVE" = /root/crm-retired/CRM-bot-tg-* && -d "$ARCHIVE" && ! -e /root/CRM-bot-tg ]]
          tar -C "$ARCHIVE" -czf - . | openssl cms -encrypt -stream -binary -aes-256-cbc -outform DER /root/crm-retired/offsite-recipient.pem
