name: CRM private quality audit
on:
  push:
    branches: [crm/scout-diagnostics]
    paths: [.github/workflows/scout-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: Private lead quality sample
    if: github.repository == 'abdylzhelil/CRM-bot-tg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: crm-production
      cancel-in-progress: false
    steps:
      - name: Read-only encrypted and anonymized lead sample
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.CRM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.CRM_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/root/CRM-bot-tg}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_PATH" = /* ]]
          install -m 700 -d "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf -- "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          printf -v remote_command '%q ' bash -s -- "$DEPLOY_PATH"
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/crm-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd -- "$1"
          [[ "$(git branch --show-current)" = ccr-a042c0a9-cjx9fv ]]
          command -v openssl >/dev/null
          AUDIT_TMP=$(mktemp -d)
          trap 'rm -rf -- "$AUDIT_TMP"' EXIT
          cat > "$AUDIT_TMP/recipient.pem" <<'AUDIT_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEGTCCAoGgAwIBAgIUWFdoI3NXnmjXjBIBMlZvkSqfFRMwDQYJKoZIhvcNAQEL
          BQAwHDEaMBgGA1UEAwwRY3JtLXF1YWxpdHktYXVkaXQwHhcNMjYxMTE0MTQzODAz
          WhcNMjYxMTE2MTQzODAzWjAcMRowGAYDVQQDDBFjcm0tcXVhbGl0eS1hdWRpdDCC
          AaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGBAN5KwlEnb98zTOuBwKlFQlW5
          UygbnfK/wT6jhltB4paTJjR/6XkdTkidMKo/ZaM8ZIPsyY6GKLqymUTs/r7BrmTj
          v0lNQQPPfweGPkpOs2o5nawhYipdOk/rqrKBhxYaSUlRhJlmCKfDqQ+wYlHUl+PN
          ZSy0iHLgmfzCsCR1TubzcXgNLpPt7jYbQeVsV3pmMrkU34rflD2N+5ULskiljPNb
          8KtpTqIbDCST2TpJBVGAnK4B/sYHdrHmzixOgyqHstZJt1rCTdmQf1cq69kExM6k
          qZxrNbBGV3hmou4h8bIXorwSbxj+m4QwNxC38Icm6jOIwz5//Rzvx6lPkrZ1l4uM
          ZoRQA8I58QLEa6hv+TtxcPiUHogPwTrRJohVD9yNTR1uoN0k5cBweXb/12UtMIE0
          LGDZQ/RWOvij3wVV63z7qkcmmyJDbpWiJJ6hkGMuzYiYrLC1leOFwDl1Mjh/TVbs
          kr8wTUgN+k5KgWBtq2mIJE9lTXzRTbDRco8YdvIZzQIDAQABo1MwUTAdBgNVHQ4E
          FgQUGyLxLzqi4nkU/iklMnyE+THsqgMwHwYDVR0jBBgwFoAUGyLxLzqi4nkU/ikl
          MnyE+THsqgMwDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAYEAgriy
          8Dnv0FM/+VUFcy/iOovUzswaPbYMdG0btMxIBxq21Ab3mCt9Iqoha4dbuyYViJPE
          9qTJZE1l4rTHYs1htYr8+R5TCRtBsM4AZHHff3ltvjWMYYGJznXeil67k6fTV7TE
          WnwT4MauEp0MWC9A81qk1OZL7VhDqn5psTvs03kLNM2+9WrxuZU60gMJEsMpVD3T
          qYJdrIjv9RO6nefNYVjtUPXQgQItct1FRZ9Psj9zcycLosaPOm7jRsVq+52c/ILy
          zRtKaV+WwVFZGCw0j465q+KfkQTu149isHmVhJbD1cpXC7FXg1vKyLQ/YAwJa4nk
          2N9bLbq1mcgnNu/1DPgjybg3q+bGRreoTKavMPQfS8nvby0oJrMkl5Dr9rcnYPVG
          BtxCNAWUS1MRz6jpjQdZ9/icq6rgk9gmD4jQm0I9M/x1Isa1MTbnh5N0hF7YUJkV
          UypCgvHlh1tX6WspnIplPeJHogd6t/fkv3B9zY0LDjpwDG7qDBsU5WDMtv+1
          -----END CERTIFICATE-----
          AUDIT_CERT
          timeout 120 docker compose exec -T -i bot python - <<'PRIVATE_SAMPLE' | openssl cms -encrypt -binary -aes-256-cbc -outform DER "$AUDIT_TMP/recipient.pem" > "$AUDIT_TMP/payload.der"
          import asyncio,json,re,logging
          from datetime import timedelta
          from sqlalchemy import select,or_
          from app.db import Session
          from app.models import Lead,FilteredMessage,Category,now
          from app.services import geo,offers
          logging.disable(logging.CRITICAL)
          def redact(text):
              text=re.sub(r"https?://\\S+|t\\.me/\\S+","[link]",text,flags=re.I)
              text=re.sub(r"(?<!\\w)@[A-Za-z0-9_]+","[contact]",text)
              text=re.sub(r"(?<!\\w)\\+?\\d[\\d ()-]{8,}\\d(?!\\w)","[phone]",text)
              text=re.sub(r"\\b[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b","[email]",text)
              return text[:900]
          async def run():
              rows=[]
              async with Session() as s:
                  cats={c.id:c for c in (await s.scalars(select(Category))).all()}
                  def niche(cid):
                      c=cats.get(cid)
                      if c and c.parent_id in cats:
                          return cats[c.parent_id].name+" / "+c.name
                      return c.name if c else "none"
                  leads=(await s.scalars(select(Lead).where(Lead.created_at>now()-timedelta(days=7),
                      or_(Lead.region=="Дагестан",Lead.city.in_(geo.home_cities("Дагестан")))).order_by(Lead.id.desc()).limit(24))).all()
                  for row in leads:
                      rows.append({"sample":len(rows)+1,"bucket":"accepted","text":redact(row.text),
                          "niche":niche(row.category_id),"city":row.city,"region":row.region,"matched":row.matched,
                          "rule_now":offers.rule_verdict(row.text)})
                  rejects=(await s.scalars(select(FilteredMessage).where(FilteredMessage.created_at>now()-timedelta(days=3)).order_by(FilteredMessage.id.desc()).limit(160))).all()
                  n=0
                  for row in rejects:
                      city,region=geo.detect(row.text,row.group_title)
                      if region!="Дагестан":
                          continue
                      rows.append({"sample":len(rows)+1,"bucket":"filtered","text":redact(row.text),
                          "city":city,"region":region,"reason":row.reason,"rule_now":offers.rule_verdict(row.text)})
                      n+=1
                      if n>=12:break
              print(json.dumps({"scope":"Dagestan, accepted seven days / filtered three days, most recent limited sample","records":rows},ensure_ascii=False))
          try:
              asyncio.run(run())
          except Exception as exc:
              import sys
              print("PRIVATE_AUDIT_FAILED:"+type(exc).__name__,file=sys.stderr)
              raise SystemExit(1)
          PRIVATE_SAMPLE
          python3 - "$AUDIT_TMP/payload.der" <<'ENCODE_PAYLOAD'
          import pathlib,sys,textwrap
          data=pathlib.Path(sys.argv[1]).read_bytes()
          value=data.hex().translate(str.maketrans("0123456789abcdef","abcdefghijklmnop"))
          print("ENCRYPTED_AUDIT_BEGIN")
          print("\n".join(textwrap.wrap(value,96)))
          print("ENCRYPTED_AUDIT_END")
          ENCODE_PAYLOAD
          REMOTE
# Read-only product funnel aggregates without user texts, IDs, contacts or secrets, 2026-11-14.

