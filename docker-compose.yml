services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///data/crm.db
    volumes:
      - ./data:/srv/data
    networks:
      default:
      # общая сеть с ботом модерации: он обращается к CRM по адресу http://crm:8090
      tgbots:
        aliases: [crm]

  # HTTPS для мини-приложения. Включается строкой COMPOSE_PROFILES=web в .env (и WEBAPP_HOST, WEBAPP_URL — см. docs/MINIAPP_SETUP.md)
  caddy:
    image: caddy:2-alpine
    profiles: [web]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBAPP_HOST: ${WEBAPP_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    mem_limit: 128m
    depends_on: [bot]

volumes:
  caddy_data:

networks:
  # создаётся один раз командой: docker network create tgbots
  tgbots:
    external: true
    name: tgbots

  # Для PostgreSQL: добавьте сервис db (postgres:16), поменяйте DATABASE_URL на
  # postgresql+asyncpg://crm:crm@db:5432/crm и добавьте depends_on: [db].
